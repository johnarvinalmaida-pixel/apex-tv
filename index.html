.shell{position:relative;z-index:1;height:100%;padding:4.2vh 5vw 5vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:.20em;font-size:clamp(18px,2.2vw,30px)}
.brand span{color:var(--red)}
.status{font-size:clamp(12px,1.2vw,16px);color:#e8e8e8;letter-spacing:.08em}
.hero{margin-top:auto;margin-bottom:auto;max-width:52vw}
.eyebrow{color:var(--red);font-weight:800;letter-spacing:.28em;font-size:clamp(10px,1vw,14px);margin-bottom:1.4vh}
h1{font-size:clamp(34px,5.3vw,76px);line-height:.92;letter-spacing:-.055em;margin:0 0 1.8vh;font-weight:900;text-transform:uppercase;text-shadow:0 5px 28px #000}
.sub{color:#d5d7dc;font-size:clamp(13px,1.35vw,18px);letter-spacing:.06em;margin:0}
.apps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1.1vw;margin-top:2vh}
.app{height:clamp(74px,12vh,112px);border:1px solid rgba(255,255,255,.24);border-radius:14px;background:rgba(9,11,16,.76);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-decoration:none;color:white;outline:none;transition:transform .16s,border-color .16s,background .16s;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.app .logo{font-size:clamp(15px,1.8vw,24px);font-weight:900;letter-spacing:-.04em}
.app small{font-size:clamp(8px,.8vw,11px);color:#b9bbc2;letter-spacing:.13em;text-transform:uppercase}
.app:focus,.app.selected{transform:scale(1.07);border:2px solid var(--red);background:rgba(25,27,34,.96);box-shadow:0 0 0 3px rgba(227,38,54,.22),0 12px 34px rgba(0,0,0,.55)}
.app:focus .logo,.app.selected .logo{color:#fff}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:2vh;color:#c3c5cb;font-size:clamp(9px,.9vw,12px);letter-spacing:.12em}
.key{display:inline-block;border:1px solid #777;border-radius:5px;padding:3px 7px;margin:0 3px;color:#fff}
@media(max-aspect-ratio:4/3){.hero{max-width:75vw}.apps{grid-template-columns:repeat(3,1fr)}.app{height:9vh}.wallpaper{opacity:.45}}

<script>
const apps=[...document.querySelectorAll('.app')];
document.addEventListener('keydown',e=>{
 const k=e.key;
 const c=e.keyCode||e.which;
 const right=k==='ArrowRight'||k==='Right'||c===39;
 const left=k==='ArrowLeft'||k==='Left'||c===37;
 const down=k==='ArrowDown'||k==='Down'||c===40;
 const up=k==='ArrowUp'||k==='Up'||c===38;
 if(right||left||down||up){
  e.preventDefault();
  if(right)focusApp(index+1);
  if(left)focusApp(index-1);
  if(down||up)focusApp(index);
 }
});
});
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'  •  '+d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});}
tick();setInterval(tick,30000);
focusApp(0);
</script>
